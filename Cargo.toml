# eseb (Elixir's Simple Encoder Binary)

[package]
name = "eseb"
version = "2.0.0"
authors = ["Alex Roper <alex@aroper.net>"]
edition = "2024"
description = "Simple symmetric encryption binary using NaCl and Snow."
license = "Apache-2.0"

[dependencies]
aes = "0.8"
anyhow = "1.0"
base64 = "0.13"
bincode = "2.0"
blake2 = "0.10"
brotli = "3.3"
build_stamp = "1.0"
clap = "3.2"
crc16 = "0.4"
generic-array = "0.14"
record_reader = { version = "1.1", git = "https://github.com/calmofthestorm/record_reader.git", features = [] }
serde = { version = "1.0", default-features = false, features = [ "derive", "std", "alloc" ] }
snow = "0.10"
sodiumoxide = "0.2"

[build-dependencies]
build_stamp = "1.0"

[dev-dependencies]
assert_cmd = "2.0"
hex = "0.4"
predicates = "3.1"
proptest = "1.4"
tempfile = "3.10"
